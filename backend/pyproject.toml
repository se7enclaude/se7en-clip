[project]
name = "medialab"
version = "1.5.0"
description = "Media Lab — media downloader and AI upscaler"
requires-python = ">=3.11"

[project.scripts]
medialab = "medialab.main:main"
medialab-cli = "medialab.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "network: tests that need internet access",
  "ffmpeg: tests that need FFmpeg installed",
  "gpu: tests that need Real-ESRGAN + a Vulkan GPU",
]
