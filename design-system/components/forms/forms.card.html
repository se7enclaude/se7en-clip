<!DOCTYPE html><html><head><meta charset="utf-8"><title>Forms</title>
<link rel="stylesheet" href="../../styles.css">
<style>body{padding:24px}.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px}.col{display:flex;flex-direction:column;gap:16px}.lbl{font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-tertiary);width:84px;flex-shrink:0}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script></head><body><div id="root"></div>
<script type="text/babel">
const { UrlInput, Select, Segmented, Switch, Checkbox, Button } = window.DownloadEverythingDesignSystem_620170;
function Demo(){
const [u,setU]=React.useState('https://vimeo.com/824117301');const [f,setF]=React.useState('mp4');const [t,setT]=React.useState('Vidéo');const [sw,setSw]=React.useState(true);const [c,setC]=React.useState(true);
return <div className="col">
<UrlInput size="lg" value={u} onChange={setU} action={<Button size="lg" icon="scan-search">Analyser</Button>}/>
<div className="row"><Select label="Format" icon="film" value={f} onChange={setF} options={[{value:'mp4',label:'MP4 · H.264'},{value:'webm',label:'WEBM'},{value:'mp3',label:'MP3 (audio)'}]} style={{width:200}}/><Segmented options={['Tout','Vidéo','Photo','Audio']} value={t} onChange={setT}/></div>
<div className="row" style={{gap:28}}><Switch checked={sw} onChange={setSw} label="Upscale automatique" description="Après chaque téléchargement"/><Checkbox checked={c} onChange={setC} label="Sous-titres"/><Checkbox label="Miniature"/></div>
</div>}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
