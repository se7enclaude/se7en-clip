<!-- @dsCard group="Colors" viewport="700x150" name="Semantic" subtitle="Status hues with soft backgrounds" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Semantic</title><link rel="stylesheet" href="../styles.css">
<style>body{padding:24px}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}.chip{height:64px;border-radius:var(--radius-sm);border:1px solid var(--border-subtle)}.n{font:var(--weight-semibold) 12px/1 var(--font-sans)}.v{font:11px/1 var(--font-mono);color:var(--text-tertiary)}.lbl{font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-tertiary)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--success)"></div><span class="n">success</span><span class="v">#3FD68F</span></div><div class="sw"><div class="chip" style="background:var(--success-soft)"></div><span class="n">success-soft</span><span class="v">#0E2A1D</span></div><div class="sw"><div class="chip" style="background:var(--warning)"></div><span class="n">warning</span><span class="v">#F5B544</span></div><div class="sw"><div class="chip" style="background:var(--warning-soft)"></div><span class="n">warning-soft</span><span class="v">#2E220C</span></div><div class="sw"><div class="chip" style="background:var(--info)"></div><span class="n">info</span><span class="v">#6FA8FF</span></div><div class="sw"><div class="chip" style="background:var(--info-soft)"></div><span class="n">info-soft</span><span class="v">#0F1E36</span></div><div class="sw"><div class="chip" style="background:var(--danger)"></div><span class="n">danger</span><span class="v">#F2555A</span></div></div></body></html>
