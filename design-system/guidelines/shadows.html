<!DOCTYPE html><html><head><meta charset="utf-8"><title>Shadows</title><link rel="stylesheet" href="../styles.css">
<style>body{padding:24px}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}.chip{height:64px;border-radius:var(--radius-sm);border:1px solid var(--border-subtle)}.n{font:var(--weight-semibold) 12px/1 var(--font-sans)}.v{font:11px/1 var(--font-mono);color:var(--text-tertiary)}.lbl{font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-tertiary)}body{background:var(--ink-2)}</style></head><body><div class="row" style="gap:24px;padding:10px"><div style="flex:1;height:90px;border-radius:var(--radius-md);background:var(--surface-3);box-shadow:var(--shadow-1);display:flex;align-items:flex-end;padding:10px"><span class="n">shadow-1</span></div><div style="flex:1;height:90px;border-radius:var(--radius-md);background:var(--surface-3);box-shadow:var(--shadow-2);display:flex;align-items:flex-end;padding:10px"><span class="n">shadow-2</span></div><div style="flex:1;height:90px;border-radius:var(--radius-md);background:var(--surface-3);box-shadow:var(--shadow-3);display:flex;align-items:flex-end;padding:10px"><span class="n">shadow-3</span></div><div style="flex:1;height:90px;border-radius:var(--radius-md);background:var(--accent);box-shadow:var(--shadow-accent);display:flex;align-items:flex-end;padding:10px"><span class="n">shadow-accent</span></div></div></body></html>
