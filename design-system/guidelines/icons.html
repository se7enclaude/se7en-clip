<!-- @dsCard group="Brand" viewport="700x170" name="Iconography" subtitle="Lucide, 1.5–2px stroke, currentColor" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Icons</title><link rel="stylesheet" href="../styles.css">
<style>body{padding:24px}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}.chip{height:64px;border-radius:var(--radius-sm);border:1px solid var(--border-subtle)}.n{font:var(--weight-semibold) 12px/1 var(--font-sans)}.v{font:11px/1 var(--font-mono);color:var(--text-tertiary)}.lbl{font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-tertiary)}.g{display:grid;grid-template-columns:repeat(10,1fr);gap:10px}.g div{height:52px;border-radius:var(--radius-sm);background:var(--surface-1);display:flex;align-items:center;justify-content:center;font-size:20px}</style></head><body><div class="g"><div title="download"><i class="icon-download"></i></div><div title="link"><i class="icon-link"></i></div><div title="sparkles"><i class="icon-sparkles"></i></div><div title="scan-search"><i class="icon-scan-search"></i></div><div title="clapperboard"><i class="icon-clapperboard"></i></div><div title="image"><i class="icon-image"></i></div><div title="audio-lines"><i class="icon-audio-lines"></i></div><div title="folder-open"><i class="icon-folder-open"></i></div><div title="list"><i class="icon-list"></i></div><div title="settings"><i class="icon-settings"></i></div><div title="arrow-right"><i class="icon-arrow-right"></i></div><div title="arrow-up-right"><i class="icon-arrow-up-right"></i></div><div title="pause"><i class="icon-pause"></i></div><div title="play"><i class="icon-play"></i></div><div title="rotate-cw"><i class="icon-rotate-cw"></i></div><div title="check"><i class="icon-check"></i></div><div title="x"><i class="icon-x"></i></div><div title="chevrons-left-right"><i class="icon-chevrons-left-right"></i></div><div title="house"><i class="icon-house"></i></div><div title="globe"><i class="icon-globe"></i></div></div></body></html>
