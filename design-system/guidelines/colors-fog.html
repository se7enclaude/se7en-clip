<!DOCTYPE html><html><head><meta charset="utf-8"><title>Fog</title><link rel="stylesheet" href="../styles.css">
<style>body{padding:24px}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}.chip{height:64px;border-radius:var(--radius-sm);border:1px solid var(--border-subtle)}.n{font:var(--weight-semibold) 12px/1 var(--font-sans)}.v{font:11px/1 var(--font-mono);color:var(--text-tertiary)}.lbl{font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-tertiary)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--fog-0)"></div><span class="n">fog-0</span><span class="v">#FFFFFF</span></div><div class="sw"><div class="chip" style="background:var(--fog-1)"></div><span class="n">fog-1</span><span class="v">#F4F3F1</span></div><div class="sw"><div class="chip" style="background:var(--fog-2)"></div><span class="n">fog-2</span><span class="v">#B9B8B5</span></div><div class="sw"><div class="chip" style="background:var(--fog-3)"></div><span class="n">fog-3</span><span class="v">#7D7C79</span></div><div class="sw"><div class="chip" style="background:var(--fog-4)"></div><span class="n">fog-4</span><span class="v">#4E4D4B</span></div></div></body></html>
