<!-- @dsCard group="Spacing" viewport="700x150" name="Corner radii" subtitle="Near-square: 4px controls, 10px panels" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Radii</title><link rel="stylesheet" href="../styles.css">
<style>body{padding:24px}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}.chip{height:64px;border-radius:var(--radius-sm);border:1px solid var(--border-subtle)}.n{font:var(--weight-semibold) 12px/1 var(--font-sans)}.v{font:11px/1 var(--font-mono);color:var(--text-tertiary)}.lbl{font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-tertiary)}</style></head><body><div class="row" style="gap:18px"><div style="display:flex;flex-direction:column;gap:8px;align-items:center"><div style="width:80px;height:64px;background:var(--surface-3);border:1px solid var(--border-strong);border-radius:var(--radius-xs)"></div><span class="n">xs</span><span class="v">2px</span></div><div style="display:flex;flex-direction:column;gap:8px;align-items:center"><div style="width:80px;height:64px;background:var(--surface-3);border:1px solid var(--border-strong);border-radius:var(--radius-sm)"></div><span class="n">sm</span><span class="v">4px</span></div><div style="display:flex;flex-direction:column;gap:8px;align-items:center"><div style="width:80px;height:64px;background:var(--surface-3);border:1px solid var(--border-strong);border-radius:var(--radius-md)"></div><span class="n">md</span><span class="v">6px</span></div><div style="display:flex;flex-direction:column;gap:8px;align-items:center"><div style="width:80px;height:64px;background:var(--surface-3);border:1px solid var(--border-strong);border-radius:var(--radius-lg)"></div><span class="n">lg</span><span class="v">10px</span></div><div style="display:flex;flex-direction:column;gap:8px;align-items:center"><div style="width:80px;height:64px;background:var(--surface-3);border:1px solid var(--border-strong);border-radius:var(--radius-xl)"></div><span class="n">xl</span><span class="v">14px</span></div><div style="display:flex;flex-direction:column;gap:8px;align-items:center"><div style="width:120px;height:64px;background:var(--surface-3);border:1px solid var(--border-strong);border-radius:var(--radius-pill)"></div><span class="n">pill</span><span class="v">999px</span></div></div></body></html>
