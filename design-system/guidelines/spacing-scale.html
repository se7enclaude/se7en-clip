<!DOCTYPE html><html><head><meta charset="utf-8"><title>Spacing</title><link rel="stylesheet" href="../styles.css">
<style>body{padding:24px}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}.chip{height:64px;border-radius:var(--radius-sm);border:1px solid var(--border-subtle)}.n{font:var(--weight-semibold) 12px/1 var(--font-sans)}.v{font:11px/1 var(--font-mono);color:var(--text-tertiary)}.lbl{font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-tertiary)}</style></head><body><div style="display:flex;align-items:flex-end;gap:14px"><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:2px;height:2px;background:var(--accent);border-radius:2px"></div><span class="v">2</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:3.6px;height:4px;background:var(--accent);border-radius:2px"></div><span class="v">4</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:7.2px;height:8px;background:var(--accent);border-radius:2px"></div><span class="v">8</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:10.8px;height:12px;background:var(--accent);border-radius:2px"></div><span class="v">12</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:14.4px;height:16px;background:var(--accent);border-radius:2px"></div><span class="v">16</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:18px;height:20px;background:var(--accent);border-radius:2px"></div><span class="v">20</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:21.6px;height:24px;background:var(--accent);border-radius:2px"></div><span class="v">24</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:28.8px;height:32px;background:var(--accent);border-radius:2px"></div><span class="v">32</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:36px;height:40px;background:var(--accent);border-radius:2px"></div><span class="v">40</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:50.4px;height:56px;background:var(--accent);border-radius:2px"></div><span class="v">56</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:64.8px;height:72px;background:var(--accent);border-radius:2px"></div><span class="v">72</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:86.4px;height:96px;background:var(--accent);border-radius:2px"></div><span class="v">96</span></div></div></body></html>
