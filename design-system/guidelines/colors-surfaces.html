<!-- @dsCard group="Colors" viewport="700x170" name="Surfaces & borders" subtitle="Semantic aliases — theme-aware" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Surfaces</title><link rel="stylesheet" href="../styles.css">
<style>body{padding:24px}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}.chip{height:64px;border-radius:var(--radius-sm);border:1px solid var(--border-subtle)}.n{font:var(--weight-semibold) 12px/1 var(--font-sans)}.v{font:11px/1 var(--font-mono);color:var(--text-tertiary)}.lbl{font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-tertiary)}.s{flex:1;height:96px;border-radius:var(--radius-md);padding:12px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;border:1px solid var(--border-default)}</style></head><body><div class="row"><div class="s" style="background:var(--bg-app)"><span class="n">bg-app</span></div><div class="s" style="background:var(--surface-1)"><span class="n">surface-1</span></div><div class="s" style="background:var(--surface-2)"><span class="n">surface-2</span></div><div class="s" style="background:var(--surface-3)"><span class="n">surface-3</span></div><div class="s" style="background:var(--surface-glass);border-color:var(--border-strong)"><span class="n">surface-glass</span><span class="v">border-strong</span></div></div></body></html>
