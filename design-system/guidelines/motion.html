<!-- @dsCard group="Spacing" viewport="700x150" name="Motion" subtitle="Expo ease-out; content rises 14px on enter" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Motion</title><link rel="stylesheet" href="../styles.css">
<style>body{padding:24px}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}.chip{height:64px;border-radius:var(--radius-sm);border:1px solid var(--border-subtle)}.n{font:var(--weight-semibold) 12px/1 var(--font-sans)}.v{font:11px/1 var(--font-mono);color:var(--text-tertiary)}.lbl{font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-tertiary)}.bar{height:4px;border-radius:1px;background:var(--border-default);position:relative;overflow:hidden}.bar i{position:absolute;inset:0 auto 0 0;width:30%;background:var(--accent);animation:m 1.6s var(--ease-out) infinite alternate}@keyframes m{to{left:70%}}</style></head><body><div style="display:grid;grid-template-columns:140px 1fr;gap:14px;align-items:center"><span class="n">ease-out (.16,1,.3,1)</span><div class="bar"><i></i></div><span class="v">dur-fast 140ms</span><span class="v">hover colour</span><span class="v">dur-base 260ms</span><span class="v">controls, tab underline</span><span class="v">dur-slow 700ms</span><span class="v">page rise, pixel-resolve, progress</span></div></body></html>
