<!DOCTYPE html><html><head><meta charset="utf-8"><title>Steel</title><link rel="stylesheet" href="../styles.css">
<style>body{padding:24px}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}.chip{height:64px;border-radius:var(--radius-sm);border:1px solid var(--border-subtle)}.n{font:var(--weight-semibold) 12px/1 var(--font-sans)}.v{font:11px/1 var(--font-mono);color:var(--text-tertiary)}.lbl{font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-tertiary)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--steel-100)"></div><span class="n">steel-100</span><span class="v">#E6E9ED</span></div><div class="sw"><div class="chip" style="background:var(--steel-200)"></div><span class="n">steel-200</span><span class="v">#D3D8DE</span></div><div class="sw"><div class="chip" style="background:var(--steel-300)"></div><span class="n">steel-300</span><span class="v">#BFC6CE</span></div><div class="sw"><div class="chip" style="background:var(--steel-400)"></div><span class="n">steel-400</span><span class="v">#9AA3AD</span></div><div class="sw"><div class="chip" style="background:var(--steel-500)"></div><span class="n">steel-500</span><span class="v">#77808B</span></div><div class="sw"><div class="chip" style="background:var(--steel-600)"></div><span class="n">steel-600</span><span class="v">#5A626C</span></div><div class="sw"><div class="chip" style="background:var(--steel-700)"></div><span class="n">steel-700</span><span class="v">#3F464E</span></div></div></body></html>
