<!-- @dsCard group="Type" viewport="700x260" name="Text scale" subtitle="Title (Syne), subtitle/body (Geist), label (Geist Mono)" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Scale</title><link rel="stylesheet" href="../styles.css">
<style>body{padding:24px}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}.chip{height:64px;border-radius:var(--radius-sm);border:1px solid var(--border-subtle)}.n{font:var(--weight-semibold) 12px/1 var(--font-sans)}.v{font:11px/1 var(--font-mono);color:var(--text-tertiary)}.lbl{font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-tertiary)}.r{display:flex;align-items:baseline;gap:20px;padding:6px 0;border-bottom:1px solid var(--border-subtle)}.r .v{width:160px;flex-shrink:0}</style></head><body>
<div class="r"><span class="v">title · Syne 700 · 30</span><span style="font:var(--type-title);letter-spacing:var(--tracking-heading)">File d'attente</span></div>
<div class="r"><span class="v">subtitle · Geist 600 · 22</span><span style="font:var(--type-subtitle)">Choisissez une qualité</span></div>
<div class="r"><span class="v">body · Geist 400 · 15</span><span style="font:var(--type-body);color:var(--text-secondary)">Un lien suffit. On s'occupe du reste.</span></div>
<div class="r"><span class="v">body-sm · 400 · 13</span><span style="font:var(--type-body-sm);color:var(--text-tertiary)">3 éléments détectés sur cette page</span></div>
<div class="r"><span class="v">label · Mono 500 · 10 · caps</span><span class="lbl" style="color:var(--accent-text)">01 — Coller un lien</span></div></body></html>
