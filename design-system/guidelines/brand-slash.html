<!-- @dsCard group="Brand" viewport="700x260" name="Pixel-resolve" subtitle="Coarse → crisp: the upscale made visible" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Resolve</title><link rel="stylesheet" href="../styles.css">
<style>body{padding:24px}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}.chip{height:64px;border-radius:var(--radius-sm);border:1px solid var(--border-subtle)}.n{font:var(--weight-semibold) 12px/1 var(--font-sans)}.v{font:11px/1 var(--font-mono);color:var(--text-tertiary)}.lbl{font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-tertiary)}body{padding:0}</style></head><body><div style="display:flex;height:260px"><div style="flex:1;position:relative;overflow:hidden"><canvas data-b="40" style="width:100%;height:100%;display:block"></canvas><span class="lbl" style="position:absolute;left:10px;bottom:10px;color:var(--text-primary)">144p</span></div><div style="flex:1;position:relative;overflow:hidden"><canvas data-b="20" style="width:100%;height:100%;display:block"></canvas><span class="lbl" style="position:absolute;left:10px;bottom:10px;color:var(--text-primary)">360p</span></div><div style="flex:1;position:relative;overflow:hidden"><canvas data-b="10" style="width:100%;height:100%;display:block"></canvas><span class="lbl" style="position:absolute;left:10px;bottom:10px;color:var(--text-primary)">720p</span></div><div style="flex:1;position:relative;overflow:hidden"><canvas data-b="4" style="width:100%;height:100%;display:block"></canvas><span class="lbl" style="position:absolute;left:10px;bottom:10px;color:var(--text-primary)">1080p</span></div><div style="flex:1;position:relative;overflow:hidden"><canvas data-b="1" style="width:100%;height:100%;display:block"></canvas><span class="lbl" style="position:absolute;left:10px;bottom:10px;color:var(--text-primary)">4K</span></div></div>
<script>document.fonts.ready.then(()=>{document.querySelectorAll('canvas').forEach(c=>{const W=c.clientWidth,H=c.clientHeight,d=devicePixelRatio||1,b=+c.dataset.b;c.width=W*d;c.height=H*d;const s=document.createElement('canvas');s.width=W*5;s.height=H;const x=s.getContext('2d');const g=x.createRadialGradient(W*2.8,H*.4,0,W*2.8,H*.4,W*2.4);g.addColorStop(0,'#F22B2B');g.addColorStop(.5,'#5a1010');g.addColorStop(1,'#0B0B0C');x.fillStyle=g;x.fillRect(0,0,W*5,H);const idx=[...c.parentNode.parentNode.children].indexOf(c.parentNode);const o=document.createElement('canvas');o.width=Math.ceil(W/b);o.height=Math.ceil(H/b);o.getContext('2d').drawImage(s,idx*W,0,W,H,0,0,o.width,o.height);const cx=c.getContext('2d');cx.imageSmoothingEnabled=false;cx.drawImage(o,0,0,o.width*b*d,o.height*b*d);if(b>=6){cx.fillStyle='rgba(5,5,5,.6)';for(let i=0;i<o.width;i++)cx.fillRect(i*b*d,0,d,H*d);for(let j=0;j<o.height;j++)cx.fillRect(0,j*b*d,W*d,d)}})})</script></body></html>
